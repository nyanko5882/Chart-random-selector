<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>ランダム課題曲</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="condition">
            <h2 style="text-align: center;">絞り込み条件</h2>
            <article id="condition-difficulty" class="condition-elements">
                <input type="checkbox"><span class="condition-title">譜面定数</span>
                <div> 
                    <input type="number" min="0">以上
                    <input type="number">以下
                </div>
            </article>
            <article id="condition-difficultType" class="condition-elements">
                <input type="checkbox"><span class="condition-title">難易度</span>
                <div>
                    <input name="condition-difficultType-check" type="checkbox"> PST
                    <input name="condition-difficultType-check" type="checkbox"> PRS
                    <input name="condition-difficultType-check" type="checkbox"> FTR
                    <input name="condition-difficultType-check" type="checkbox"> BYD
                    <input name="condition-difficultType-check" type="checkbox"> ETR
                    <input name="condition-difficultType-check" type="checkbox"> INS
                </div>
            </article>
            <article id="condition-packs" class="condition-elements">
                <input type="checkbox"><span class="condition-title">パック</span> <!--buttonにして別タブにしてもいいかも-->
            </article>
            <article id="condition-removed" class="condition-elements">
                <button id="removed-link">除外曲を設定する</button>
            </article>
        </div>
        <main id="main">                
            <h1 id="songtitle"><span id="songname"></span><img id="difficultType"><span id="difficulty"></span></h1>
                 <!--imgはFTRとかの◆のロゴのやつ-->
            <p>Composer: <span id="data-composer"></span></p>
            <p>Pack: <span id="data-pack"></span></p>
        </main>
        <script src="script.js"></script>
    </body>
</html>
